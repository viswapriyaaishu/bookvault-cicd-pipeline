
---
- name: Configure BookVault Local WSL Environment
  hosts: bookvault_servers
  become: true

  tasks:
    - name: Install Git and Docker
      ansible.builtin.apt:
        name:
          - git
          - docker.io
        state: present
        update_cache: true

    - name: Create BookVault application directory
      ansible.builtin.file:
        path: /opt/bookvault
        state: directory
        mode: "0755"

    - name: Display configuration completion
      ansible.builtin.debug:
        msg: "BookVault WSL configuration completed."
