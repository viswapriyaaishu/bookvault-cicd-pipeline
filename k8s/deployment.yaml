
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookvault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bookvault
  template:
    metadata:
      labels:
        app: bookvault
    spec:
      containers:
        - name: bookvault
          image: viswapriya/bookvault:IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64m -XX:MaxRAMPercentage=55.0"
          resources:
            requests:
              memory: "96Mi"
              cpu: "100m"
            limits:
              memory: "320Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
